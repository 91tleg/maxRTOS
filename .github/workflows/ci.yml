name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Host Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: |
          cmake \
            -S maxrtos/tests \
            -B build/tests \
            -G Ninja

      - name: Build
        run: |
          cmake \
            --build build/tests \
            -j2

      - name: Run tests
        run: |
          ctest \
            --test-dir build/tests \
            --output-on-failure

      - name: Requirements traceability
        run: |
          python3 maxrtos/tests/sil/tools/traceability.py \
            build/tests/sil-reports

      - name: Upload SIL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-reports
          path: build/tests/sil-reports

  sil-coverage:
    name: SIL Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcovr

      - name: Configure
        run: |
          cmake \
            -S maxrtos/tests \
            -B build/coverage \
            -G Ninja \
            -DMAXRTOS_TEST_COVERAGE=ON

      - name: Build and run
        run: |
          cmake --build build/coverage -j2
          ctest --test-dir build/coverage --output-on-failure

      # Production code only: the kernel and the hardware-independent
      # architecture sources. Files that are pure hardware access (context
      # switch, fault exception entry, SVC wrappers, mutex) cannot run on the
      # host and are covered by the QEMU job instead.
      - name: Coverage gate
        run: |
          gcovr \
            --root . \
            --object-directory build/coverage \
            --filter 'maxrtos/kernel/src/' \
            --filter 'maxrtos/arch/cortex_m7/src/' \
            --exclude 'maxrtos/arch/cortex_m7/src/(context_switch|fault_handlers|queue_port|yield|mutex)\.c' \
            --exclude-throw-branches \
            --fail-under-line 88 \
            --fail-under-branch 70 \
            --print-summary \
            --html-details build/coverage/coverage.html \
            --xml build/coverage/coverage.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-coverage
          path: |
            build/coverage/coverage.html
            build/coverage/coverage.*.html
            build/coverage/coverage.xml

  sil-sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest

    strategy:
      matrix:
        sanitizer: [undefined, address]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: |
          cmake \
            -S maxrtos/tests \
            -B build/san \
            -G Ninja \
            -DMAXRTOS_TEST_SANITIZE=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build/san -j2

      - name: Run tests
        run: ctest --test-dir build/san --output-on-failure

  sil-mutation:
    name: SIL Mutation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: |
          cmake \
            -S maxrtos/tests \
            -B build/mutation \
            -G Ninja

      # Injects known defects into the kernel/architecture code one at a time
      # and requires the SIL suites to catch every one.
      - name: Mutation check
        run: |
          python3 maxrtos/tests/sil/tools/mutation_check.py build/mutation

  qemu:
    name: QEMU Emulation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-jinja2 \
            cmake \
            ninja-build

      - name: Install Arm GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Cache QEMU
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ~/qemu-10.1.0
          key: qemu-10.1.0-arm-softmmu-${{ runner.os }}

      - name: Build QEMU 10.1.0
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y \
            libglib2.0-dev libpixman-1-dev pkg-config python3-venv
          curl -fsSL https://download.qemu.org/qemu-10.1.0.tar.xz | tar -xJ
          cd qemu-10.1.0
          ./configure \
            --target-list=arm-softmmu \
            --prefix=$HOME/qemu-10.1.0 \
            --disable-docs --disable-werror
          make -j$(nproc)
          make install

      - name: Add QEMU to PATH
        run: echo "$HOME/qemu-10.1.0/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1

      - name: Configure
        run: |
          cmake \
            -S maxrtos/tests/qemu \
            -B build/qemu \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/arm-none-eabi.cmake

      - name: Build
        run: |
          cmake \
            --build build/qemu \
            -j2

      - name: Run tests
        run: |
          ctest \
            --test-dir build/qemu \
            --output-on-failure

  build-nucleo:
    name: Build Nucleo Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            cmake \
            ninja-build

      - name: Install Arm GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install codegen
        run: |
          pip3 install -e tools/maxrtos_codegen

      - name: Generate Nucleo configuration
        run: |
          maxrtos-codegen \
            demo/nucleo_h753zi/module.json \
            --out-dir demo/nucleo_h753zi/generated

      - name: Configure
        run: |
          cmake \
            -S demo/nucleo_h753zi \
            -B build/nucleo \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/arm-none-eabi.cmake

      - name: Build
        run: |
          cmake \
            --build build/nucleo \
            --target maxrtos_demo_nucleo_h753zi \
            -j2

      - name: Verify ELF
        run: |
          arm-none-eabi-size \
            build/nucleo/maxrtos_demo_nucleo_h753zi

      - name: Generate binary
        run: |
          arm-none-eabi-objcopy \
            -O binary \
            build/nucleo/maxrtos_demo_nucleo_h753zi \
            build/nucleo/maxrtos_demo_nucleo_h753zi.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: maxrtos-nucleo-h753zi
          path: |
            build/nucleo/maxrtos_demo_nucleo_h753zi
            build/nucleo/maxrtos_demo_nucleo_h753zi.bin
            build/nucleo/maxrtos_demo_nucleo_h753zi.map
